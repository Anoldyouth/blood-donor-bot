# Сайты в порядке приоритета. Записались на первом доступном — остальные пропускаем.
sites:
  - name: tsaritsyno          # Центр крови им. Гаврилова, отделение Царицыно (Бакинская, 31)
    url: https://donor-mos-zar.online
  - name: shabolovka          # отделение Шаболовка (Шаболовка, 57)
    url: https://donor-mos-sab.online
  - name: begovaya            # головное отделение (Поликарпова, 14)
    url: https://donor-mos.online

# Страница личного кабинета относительно url сайта
account_path: /account/

schedule:
  timezone: Europe/Moscow
  time: "12:00"            # когда открываются слоты (за 3 дня до даты донации)
  start_before_sec: 80     # за сколько секунд до time войти, взять токен капчи и начать опрос (частый — за 40 с)
  window_min: 20           # сколько минут после time продолжать попытки
  retry_interval_sec: 1    # пауза между кругами по сайтам
  parallel_sites: true     # каждый сайт в своём браузере одновременно (сессии у сайтов независимые)

booking:
  donation_type_regex: "тромбоцит"   # что выбирать, если сайт предлагает вид донации
  date_preference: earliest          # earliest | latest
  preferred_times: []                # например ["09:00", "09:30"]; пусто = самое раннее
  dry_run: false                     # true = дойти до кнопки подтверждения и НЕ нажимать
  pause_days_after_success: 14       # после успешной записи не пытаться записаться столько дней

browser:
  headless: false          # видимый браузер реже получает задание капчи от Яндекса
  slow_mo_ms: 0
  timeout_ms: 10000
  profile_dir: browser_profile   # постоянный профиль (cookies) — капча «запоминает» браузер
  # channel: chrome        # раскомментируйте, чтобы использовать установленный Google Chrome

# Яндекс SmartCaptcha. Чекбокс «Я не робот» бот кликает сам. Если Яндекс показывает
# задание (картинки/слайдер), его решает сервис распознавания по API-ключу из .env
# (CAPTCHA_API_KEY). Поддерживаются rucaptcha и 2captcha (один и тот же API).
captcha:
  solver: rucaptcha        # rucaptcha | 2captcha
  solver_url: ""           # свой URL API, если нужен (по умолчанию по solver)
  solve_timeout_sec: 150   # сколько ждать ответа сервиса

# Переопределение CSS-селекторов, если автопоиск не справился
# (значения — список CSS-селекторов, проверяются по порядку).
selectors: {}
#  login_input: ["input[name='email']"]
#  password_input: ["input[name='password']"]
#  login_submit: ["button[type='submit']"]
#  book_button: ["a.btn-record"]
#  donation_type: ["label:has-text('Тромбоциты')"]
#  date: [".calendar .day:not(.disabled)"]
#  time: [".slots .slot:not(.busy)"]
#  confirm: ["button:has-text('Подтвердить')"]
#  success: [".alert-success"]
#  has_booking: [".my-record"]

# Архив прогонов: скриншоты, HTML и список элементов каждого шага, журнал нажатий
# с селекторами (trace_NN.json), история результатов (runs/history.jsonl).
archive:
  dir: runs
  keep_days: 30            # старше — удаляются; 0 = хранить всё

# После успешного прохождения формы бот сохраняет селекторы нажатых элементов в
# learned/<сайт>.json и в следующих запусках пробует их первыми (быстрее и надёжнее
# эвристик). Если селектор не находит элемент — работает обычный автопоиск.
learning:
  enabled: true
  dir: learned

state_file: state.json
log_file: bot.log
