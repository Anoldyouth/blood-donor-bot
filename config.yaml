# Сайты Центра крови им. О.К. Гаврилова. Ловятся параллельно, заявка — одна на все.
# Порядок = приоритет: если слот есть на нескольких сайтах, запись уходит на верхний.
# Где вместо галочки капча требует задание, токены заранее берутся у rucaptcha
# (CAPTCHA_API_KEY в .env); без ключа такой сайт в этот день пропускается.
sites:
  - name: shabolovka            # Шаболовка, 57
    url: https://donor-mos-sab.online
  - name: begovaya              # Беговая, Поликарпова 14
    url: https://donor-mos.online
  - name: tsaritsyno            # Царицыно, Бакинская 31
    url: https://donor-mos-zar.online

open_time: "12:00"        # МСК; новая дата (сегодня+3) открывается в это время
start_before_sec: 180     # за сколько секунд войти и начать опрос (токен rucaptcha — 30–70 с)
window_sec: 300           # сколько ловить после open_time
poll_interval_sec: 0.35   # новый запрос кабинета каждые столько секунд
poll_parallel: 3          # одновременных запросов на сайт
session_refresh_sec: 15   # сессия на сайте живёт 30–60 с
token_max_age_sec: 60     # токен капчи старше — взять новый
service_token_max_age_sec: 300  # токен rucaptcha живёт 7–10 мин, берём не старше 5
priority_wait_sec: 2      # нашёл слот — до стольких секунд ждать ответа сайтов выше по приоритету
preferred_times: []       # например ["09:00"]; пусто = самое раннее
dry_run: false            # true = найти слот, но заявку не отправлять
headless: true            # окно браузера с капчей не показывать
